name: Windows-Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Syntaxprüfung
        run: npm run check

      - name: Fensterscanner testen (Windows-API)
        run: node main/winscan-native.js

      - name: Spielerkennung testen
        run: node main/games.js

      - name: Systemsensoren testen
        run: node main/sensors.js

      - name: Fensterscanner testen (PowerShell)
        shell: pwsh
        run: |
          $script = (Get-Content -Raw main/winscan.ps1).Replace('__OWNPID__', "$PID")
          $script = $script.Replace('while ($true) {', 'for ($i = 0; $i -lt 2; $i++) {')
          $enc = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
          $out = powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $enc
          Write-Output $out
          $first = $out | Select-Object -First 1
          if (-not $first -or -not $first.TrimStart([char]0xFEFF).StartsWith('{')) { throw 'Fensterscanner liefert kein JSON' }

      - name: Neue Version? (Release für die Update-Funktion)
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && ! gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "publish=always" >> "$GITHUB_OUTPUT"; echo "Neue Version v$VERSION wird veröffentlicht."
          else
            echo "publish=never" >> "$GITHUB_OUTPUT"; echo "Kein neues Release (v$VERSION existiert oder kein main-Push)."
          fi

      - name: Windows-Programm bauen
        run: npx electron-builder --win portable nsis --x64 --publish ${{ steps.ver.outputs.publish }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gepacktes Programm testen
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest.json'
          Start-Process -FilePath 'dist/win-unpacked/Shadepi Deskpet.exe' -ArgumentList "--selftest=$out" -Wait -PassThru | Out-Null
          $res = Get-Content $out -Raw | ConvertFrom-Json
          Write-Output $res
          if ($res.method -ne 'native') { throw "Scanner nicht nativ: $($res.method) $($res.error)" }
          if ($res.windows -lt 1) { throw 'Keine Fenster erkannt' }
          if (-not $res.games) { throw 'Spielerkennung nicht geladen' }
          if (-not $res.visible) { throw 'Overlay nach dem Spielmodus nicht wieder sichtbar' }
          if ($res.mouseRearms -lt 1 -or $res.mouseAck -lt 1) { throw "Maus nach dem Spielmodus nicht neu eingerichtet ($($res.mouseRearms)/$($res.mouseAck))" }
          if ($res.renderer.frames -lt 1) { throw 'Animation läuft nicht' }
          # Zweiter Monitor (simuliert): eigenes Fenster, gemeinsame Welt
          $out2 = Join-Path $env:RUNNER_TEMP 'selftest2.json'
          $env:DESKPET_FAKE_DISPLAYS = '[{"id":1,"bounds":{"x":0,"y":0,"width":1024,"height":768},"workArea":{"x":0,"y":0,"width":1024,"height":728},"scaleFactor":1},{"id":2,"bounds":{"x":1024,"y":0,"width":1280,"height":720},"workArea":{"x":1024,"y":0,"width":1280,"height":680},"scaleFactor":1.25}]'
          Start-Process -FilePath 'dist/win-unpacked/Shadepi Deskpet.exe' -ArgumentList "--selftest=$out2" -Wait -PassThru | Out-Null
          Remove-Item Env:DESKPET_FAKE_DISPLAYS
          $res2 = Get-Content $out2 -Raw | ConvertFrom-Json
          Write-Output $res2.renderer
          if ($res2.views -ne 1 -or $res2.viewsVisible -ne 1) { throw "Monitorfenster fehlt ($($res2.views)/$($res2.viewsVisible))" }
          if ($res2.renderer.screens -ne 2 -or $res2.renderer.views -ne 1) { throw "Renderer kennt den zweiten Monitor nicht: $($res2.renderer | ConvertTo-Json -Compress) $($res2.rendererError)" }

      - uses: actions/upload-artifact@v4
        with:
          name: Shadepi-Deskpet-Windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

