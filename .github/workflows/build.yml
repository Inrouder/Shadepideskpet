name: Windows-Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Syntaxprüfung
        run: npm run check

      - name: Fensterscanner testen (PowerShell)
        shell: pwsh
        run: |
          $script = (Get-Content -Raw main/winscan.ps1).Replace('__OWNPID__', "$PID")
          $script = $script.Replace('while ($true) {', 'for ($i = 0; $i -lt 2; $i++) {')
          $enc = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
          $out = powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $enc
          Write-Output $out
          $first = $out | Select-Object -First 1
          if (-not $first -or -not $first.TrimStart([char]0xFEFF).StartsWith('{')) { throw 'Fensterscanner liefert kein JSON' }

      - name: Windows-Programm bauen
        run: npx electron-builder --win portable nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Shadepi-Deskpet-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Release anlegen (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
